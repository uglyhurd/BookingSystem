<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>All Rooms</title>
</head>
<body style="background-color: #f6f3f3;font-family: Monaco,sans-serif ">

<div style="text-align: center;">
    <h1>Все комнаты</h1>
</div>
<br/>
<br/>
<div th:each="room, iterStat:${rooms}">
    <span th:text="${iterStat.count} + '.'"></span>
    <a th:href="@{/booking/showRoom/{id}(id=${room.getRoom_id()})}" th:text="${room.name} + ', Локация: ' + ${room.location}"></a>
    <br/>
    <br/>
</div>


</body>
</html>
